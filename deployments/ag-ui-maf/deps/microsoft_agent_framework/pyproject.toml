[project]
name = "cockpit-runtimes-microsoft-agent-framework"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.16.0",
    "agent-framework-openai>=1.14.1",
    "agent-framework-ag-ui>=1.2.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
