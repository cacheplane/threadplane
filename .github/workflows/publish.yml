name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no actual publish)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DO_NOT_TRACK: '1'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing + provenance
    env:
      NPM_PUBLISHABLE_PROJECTS: core,content,angular,langgraph,ag-ui,a2ui,telemetry
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Node 24 ships npm 11+ which fully implements npm trusted publishing
      # over OIDC. Node 22 is LTS but locked at npm 10.x, which has only
      # partial trusted-publishing support and fails OIDC on this registry.
      # The rest of CI (lint/test/build) runs on Node 22; this workflow
      # uses Node 24 specifically for the publish step.
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Trusted publishing requires npm CLI 11.5.1+. Node 22's bundled npm
      # is 10.x which has partial OIDC support but doesn't fully implement
      # the trusted-publishing flow against npm registry's OIDC endpoint.
      - name: Upgrade npm to support trusted publishing
        # Pinned (Scorecard Pinned-Dependencies); must stay >= 11.5.1. Bump as needed.
        run: npm install -g npm@11.17.0

      - name: Lint, test, build publishable projects
        run: npx nx run-many -t lint,test,build --projects=$NPM_PUBLISHABLE_PROJECTS --skip-nx-cache

      - name: Verify atomic release versions
        run: node scripts/verify-release-versions.mjs --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Verify installed collectors and development-only bundles
        run: |
          npx nx build growth --skip-nx-cache
          npx nx run telemetry:test-install-pack --skip-nx-cache
          npx nx run telemetry:test-development-bundle --skip-nx-cache

      # Trusted publishing is configured per-package on npm; no NPM_TOKEN needed.
      # The OIDC token from id-token: write authenticates this workflow as a
      # trusted publisher for each @threadplane/* package. Provenance attestations are
      # generated automatically.

      - name: Publish to npm
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)
        run: npx nx release publish --groups=publishable
        env:
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: npx nx release publish --groups=publishable --dry-run
