name: Railway CLI installation diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Railway installer without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
      - name: Report runtime platform
        run: node -e 'console.log(JSON.stringify({platform:process.platform,arch:process.arch,node:process.version}))'
      - name: Install and identify Railway CLI without credentials
        run: npx --yes --foreground-scripts @railway/cli@4 --version
