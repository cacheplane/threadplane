[project]
name = "cockpit-runtimes-aws-strands"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # 0.4.1 (2026-09-23) was built for ag-ui-protocol 1.0 and carries the
    # multi-agent route fix that previously forced a git pin.
    "ag-ui-strands>=0.4.1",
    "ag-ui-protocol>=1.0.0",
    "strands-agents[openai]>=1.54.0",
    # Declared directly (not only via the [openai] extra) so the generated
    # ag-ui-dev requirements union — which carries only deps attributed to
    # this cockpit-* project — keeps the OpenAI client the Strands provider
    # imports. uv export erases extras from the direct entry.
    "openai>=2.54.0",
    # Only needs to satisfy ag-ui-strands' own fastapi range.
    "fastapi>=0.121",
    "uvicorn[standard]>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
