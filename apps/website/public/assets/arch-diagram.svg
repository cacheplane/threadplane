<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 510" width="1080" height="510" role="img" aria-labelledby="a-title a-desc">
  <title id="a-title">How a call travels from an Angular component to LangGraph and back as signals</title>
  <desc id="a-desc">An Angular component calls agent(), which calls the StreamManager bridge, which calls the LangGraph Platform. Each call is a solid arrow left to right. Below them, three dashed arrows run back the other way: the platform returns SSE stream events to the bridge, the bridge returns signal updates to agent(), and agent() returns Angular signals to the component. The bridge talks to the platform through FetchStreamTransport or MockAgentTransport.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L9.5,5 L0,9.5 z" fill="#15253E"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .t-eyebrow { font-size: 11.5px; font-weight: 700; fill: #737373; letter-spacing: 0.09em; }
    .t-title { font-size: 15px; font-weight: 600; fill: #1c1c1c; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t-meta { font-size: 13px; fill: #464646; }
    .t-edge { font-size: 12.5px; font-weight: 600; fill: #15253E; }
    .edge { stroke: #15253E; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .edge-reactive { stroke: #15253E; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0.5" y="0.5" width="1079" height="509" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
  <text class="t-eyebrow" x="40" y="38">ARCHITECTURE</text>

  <!-- Box 1: Angular Component -->
  <rect x="40" y="90" width="214" height="104" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
  <text class="t-title" x="60" y="122">Angular Component</text>
  <text class="t-meta" x="60" y="146">template / signals</text>
  <text class="t-meta" x="60" y="168">submit() / stop()</text>

  <!-- Call 1 → 2 -->
  <path class="edge" d="M260,142 H298"/>

  <!-- Box 2: agent() — the emphasized node -->
  <rect x="302" y="90" width="214" height="104" rx="8" fill="#f2f5f9" stroke="#c3d1e2"/>
  <text class="t-title" x="322" y="122">agent()</text>
  <text class="t-meta" x="322" y="146">Agent UI state</text>
  <text class="t-meta" x="322" y="168">@threadplane/langgraph</text>

  <!-- Call 2 → 3 -->
  <path class="edge" d="M522,142 H560"/>

  <!-- Box 3: StreamManager Bridge -->
  <rect x="564" y="90" width="214" height="104" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
  <text class="t-title" x="584" y="120">StreamManager</text>
  <text class="t-title" x="584" y="142">Bridge</text>
  <text class="t-meta" x="584" y="168">stream-manager.bridge.ts</text>

  <!-- Call 3 → 4 -->
  <path class="edge" d="M784,142 H822"/>

  <!-- Box 4: LangGraph Platform -->
  <rect x="826" y="90" width="214" height="104" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
  <text class="t-title" x="846" y="122">LangGraph Platform</text>
  <text class="t-meta" x="846" y="146">LangGraph Cloud /</text>
  <text class="t-meta" x="846" y="168">Self-hosted Server</text>

  <!-- Reactive return: LangGraph Platform → Bridge -->
  <path class="edge-reactive" d="M933,194 V240 H685 V198"/>
  <text class="t-edge" x="809" y="232" text-anchor="middle">SSE / stream events</text>

  <!-- Reactive return: Bridge → agent() -->
  <path class="edge-reactive" d="M657,194 V290 H437 V198"/>
  <text class="t-edge" x="547" y="282" text-anchor="middle">Signal updates</text>

  <!-- Reactive return: agent() → Angular Component -->
  <path class="edge-reactive" d="M409,194 V340 H175 V198"/>
  <text class="t-edge" x="292" y="332" text-anchor="middle">Angular Signals</text>

  <!-- Transport -->
  <text class="t-meta" x="671" y="392" text-anchor="middle">FetchStreamTransport | MockAgentTransport</text>

  <!-- Rule -->
  <path d="M40,428 H1040" stroke="#e5e5e5" stroke-width="1" fill="none"/>

  <!-- Legend -->
  <path class="edge" d="M350,466 H386" marker-end="none"/>
  <text class="t-meta" x="400" y="470">call / dispatch</text>
  <path class="edge-reactive" d="M580,466 H616" marker-end="none"/>
  <text class="t-meta" x="630" y="470">reactive update</text>
</svg>
