<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" role="img" aria-labelledby="d-title d-desc">
  <title id="d-title">The runtime-neutral Agent contract between agent backends and Angular components</title>
  <desc id="d-desc">LangGraph stream chunks and AG-UI SSE events both enter a runtime adapter that normalizes, deduplicates and accumulates them. The adapter publishes one Agent contract of Angular signals — messages, status, toolCalls, state, error and interrupt — which chat components and an approved component registry read. User intent travels back through the same contract.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.5 L9.5,5 L0,9.5 z" fill="#15253E"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .t-eyebrow { font-size: 11.5px; font-weight: 700; fill: #737373; letter-spacing: 0.09em; }
    .t-head { font-size: 17px; font-weight: 600; fill: #1c1c1c; }
    .t-title { font-size: 15px; font-weight: 600; fill: #1c1c1c; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t-meta { font-size: 13px; fill: #464646; }
    .t-sig { font-size: 13.5px; fill: #15253E; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t-edge { font-size: 12.5px; font-weight: 600; fill: #15253E; }
    .t-caption { font-size: 13px; fill: #737373; }
    .edge { stroke: #15253E; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
  </style>

  <rect x="0.5" y="0.5" width="699" height="699" rx="12" fill="#ffffff" stroke="#e5e5e5"/>
  <text class="t-eyebrow" x="40" y="36">AGENTIC UI · THE NEUTRAL BOUNDARY</text>
  <text class="t-head" x="40" y="64">Runtime events go in, Angular signals come out</text>

  <text class="t-eyebrow" x="40" y="102">RUNTIME</text>
  <rect x="40" y="114" width="300" height="70" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
  <text class="t-title" x="60" y="144">LangGraph</text>
  <text class="t-meta" x="60" y="166">stream chunks</text>

  <rect x="360" y="114" width="300" height="70" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
  <text class="t-title" x="380" y="144">AG-UI</text>
  <text class="t-meta" x="380" y="166">SSE events</text>

  <path class="edge" d="M190,184 L336,256"/>
  <path class="edge" d="M510,184 L364,256"/>

  <text class="t-eyebrow" x="40" y="248">ADAPTER</text>
  <rect x="40" y="260" width="620" height="70" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
  <text class="t-title" x="60" y="290">runtime adapter</text>
  <text class="t-meta" x="60" y="312">accumulation · deduplication · lifecycle status · interrupt shape</text>

  <path class="edge" d="M350,330 V366"/>

  <text class="t-eyebrow" x="40" y="384">AGENT CONTRACT</text>
  <rect x="40" y="396" width="620" height="98" rx="8" fill="#f2f5f9" stroke="#c3d1e2"/>
  <text class="t-title" x="60" y="426">Agent</text>
  <text class="t-sig" x="60" y="452">messages()</text>
  <text class="t-sig" x="260" y="452">status()</text>
  <text class="t-sig" x="460" y="452">toolCalls()</text>
  <text class="t-sig" x="60" y="478">state()</text>
  <text class="t-sig" x="260" y="478">error()</text>
  <text class="t-sig" x="460" y="478">interrupt()</text>

  <path class="edge" d="M350,494 V530"/>

  <rect x="40" y="534" width="300" height="66" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
  <text class="t-title" x="60" y="562">&lt;chat&gt;</text>
  <text class="t-meta" x="60" y="584">tool progress · approvals</text>

  <rect x="360" y="534" width="300" height="66" rx="8" fill="#ffffff" stroke="#d4d4d4"/>
  <text class="t-title" x="380" y="562">ViewRegistry</text>
  <text class="t-meta" x="380" y="584">approved components only</text>

  <path class="edge" d="M180,600 V632 H16 V295 H36"/>
  <text class="t-edge" x="200" y="626">submit · abort · retry · respond to an interrupt</text>

  <text class="t-caption" x="40" y="666">Components never read a LangGraph chunk or an AG-UI event name. What differs</text>
  <text class="t-caption" x="40" y="686">between runtimes is feature-detected at a deliberate edge, not assumed.</text>
</svg>
